name: Update dividend dates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Update official dividend/ex-date events
        run: python scripts/update_dividends.py
      - name: Recalculate market XIRR after dividend refresh
        run: python scripts/update_market.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dividend_events.json data/preferred_stocks.json
          git diff --cached --quiet || git commit -m "Update dividend dates and XIRR"
          git push
