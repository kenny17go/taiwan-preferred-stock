name: Update TPEx bond snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 20:00 Asia/Taipei (UTC+8)
  push:
    branches: [main, feature/bond-statistics-v01]
    paths: ['scripts/fetch_bonds.py', '.github/workflows/update-bonds.yml']
permissions:
  contents: write
concurrency:
  group: bond-snapshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download TPEx bond JSON
        run: python3 scripts/fetch_bonds.py
      - name: Commit only changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bonds/ISSBD*.json
          if git diff --cached --quiet; then
            echo "No changes to bond data."
          else
            git commit -m "data: refresh TPEx bond snapshots"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
