name: Update preferred stock market data

on:
  workflow_dispatch:
  schedule:
    # Taiwan 14:45 Mon-Fri = UTC 06:45
    - cron: "45 6 * * 1-5"

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Update stock prices, yields and IRR
        run: python scripts/update_market.py
      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/preferred_stocks.json
          git diff --cached --quiet || git commit -m "Auto update preferred stock market data"
          git push
